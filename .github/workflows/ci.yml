name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the site and the command line bundle
        run: npm run bundle
      # Both are committed: Pages serves docs/, and `npx github:...` runs dist/cli.js without building anything.
      - name: Built files must be committed
        run: |
          if [ -n "$(git status --porcelain -- docs/ dist/)" ]; then
            echo "docs/ or dist/ is out of date. Run 'npm run bundle' and commit the result." >&2
            git status --short -- docs/ dist/
            exit 1
          fi
