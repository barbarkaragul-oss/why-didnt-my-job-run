name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the site
        run: npm run build
      - name: Built site must be committed
        run: |
          if ! git diff --quiet -- docs/; then
            echo "docs/ is out of date. Run 'npm run build' and commit the result." >&2
            git --no-pager diff --stat -- docs/
            exit 1
          fi
